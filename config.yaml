llm:
  provider: openai          # openai / siliconflow
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 2048

embedding:
  provider: openai          # openai / siliconflow
  model: text-embedding-ada-002

vector_store:
  persist_directory: data/chroma_db
  collection_name: rag_docs

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  chunk_mode: semantic          # fixed / semantic（fixed=固定长度, semantic=语义分块）
  supported_extensions:
    - .pdf
    - .txt
    - .md
    - .docx
    - .html

  # 语义分块参数（chunk_mode: semantic 时生效）
  semantic:
    window_size: 3              # 语义对比窗口大小（句子数）
    threshold_percentile: 60.0  # 断点阈值百分位（值越小断点越少，块越大）
    min_chunk_chars: 100        # 最小块字符数
    max_chunk_chars: 2000       # 最大块字符数

retrieval:
  k: 4                      # 检索返回的文档块数量
  score_threshold: 0.0      # 相似度阈值
  search_type: similarity   # similarity / mmr / hybrid
  rrf_k: 60                 # RRF 常数（hybrid 模式用，值越小排名靠前文档权重越大）
  hybrid_k: 4               # 混合检索中 BM25 关键词检索的文档数

  # Cross-Encoder 重排序（需安装 sentence-transformers: uv sync --extra reranker）
  reranker_enabled: true    # false / true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_k: 20              # 重排序前初检的文档数

server:
  host: 0.0.0.0
  port: 8000
  reload: false
  cors:
    enabled: true
    allow_origins:
      - "*"
    allow_credentials: true
    allow_methods:
      - "*"
    allow_headers:
      - "*"
