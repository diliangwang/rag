[project]
name = "rag-lc-pj"
version = "0.1.0"
description = "基于 LangChain 的通用文档问答 RAG 系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-openai>=0.3.0",
    "chromadb>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "httpx>=0.28.0",
    "hatchling>=1.29.0",
    "python-multipart>=0.0.28",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rag = "src.entry:cli"

[project.optional-dependencies]
reranker = ["sentence-transformers>=3.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
package = true
